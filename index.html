<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffc400">
<title>Laporan Kerja Harian</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon-round.png">
<meta name="apple-mobile-web-app-title" content="Vapor Hitz">
<style>
:root{--bg:#fffbea;--surf:#fff;--ink:#111;--mute:#5a5a5a;--line:#111;--soft:#ece6c8;--acc:#ffc400;--acc-s:#fff1b8;--chip:#f3efdc;--red:#c62828;--red-s:#fde4e2}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;border-bottom:6px solid var(--acc)}
.hd{display:flex;align-items:center;gap:12px;min-width:0}
.hd img{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--acc);flex:none;object-fit:cover}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.2px}
header h1{color:var(--acc)}
h2{font-size:16px;margin:0 0 10px;font-weight:800;display:inline-block;background:linear-gradient(transparent 55%,var(--acc) 55%);padding:0 4px;margin-left:-4px}
.sub{color:var(--mute);font-size:13px}
header .sub{color:#e8e8e8}
.card{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:4px 4px 0 var(--acc)}
input,select{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
input:focus,select:focus{outline:3px solid var(--acc);outline-offset:1px}
input::placeholder{color:#8a8a8a}
input[type=checkbox],input[type=radio]{width:20px;height:20px;padding:0;accent-color:#111;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>input{flex:1}
.btn{border:2px solid var(--line);background:var(--acc);color:var(--ink);font:inherit;font-weight:800;padding:8px 16px;border-radius:10px;cursor:pointer;box-shadow:2px 2px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--line)}
header .btn{box-shadow:none;border-color:var(--acc)}
.ed{border:1.5px solid var(--line);color:var(--ink);background:#fff;font:inherit;font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;cursor:pointer}
.ed:hover{background:var(--acc-s)}
.ed.red{border-color:var(--red);color:var(--red)}
.ed.red:hover{background:var(--red-s)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px}
.stat:first-child{background:var(--acc)}
.stat b{display:block;font-size:26px;line-height:1.2;font-weight:800}.stat span{color:var(--ink);opacity:.75;font-size:12px;font-weight:600}
.split{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.big{font-size:17px}
.bar{height:14px;border:2px solid var(--line);border-radius:99px;background:var(--chip);overflow:hidden;margin-bottom:8px}
.bar>i{display:block;height:100%;background:var(--acc)}
.task{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:11px 0;border-top:1px solid var(--soft)}
.task:first-of-type{border-top:0}
.chk,.cnt{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);font-size:22px;font-weight:800;line-height:1;flex:none}
.chk{cursor:pointer}
.cnt{display:grid;place-items:center;font-size:14px}
.task.todo .chk:hover{background:var(--acc)}
.task.done .chk,.task.done .cnt{background:var(--acc);cursor:default}
.tt{flex:1 1 140px;overflow-wrap:anywhere;font-weight:700}.task.done .tt{color:var(--mute);text-decoration:line-through;font-weight:400}
.tt .sub{font-weight:400}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--ink);border:1px solid var(--soft)}
.tag.late{background:var(--red-s);color:var(--red);border-color:var(--red)}.tag.ok{background:var(--acc);color:var(--ink);border-color:var(--line)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;width:100%}
.slot{min-height:76px;border:2px dashed var(--line);border-radius:10px;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font:inherit;padding:6px}
.slot b{font-size:22px;line-height:1}.slot span{font-size:12px;font-weight:700}
.slot:hover{background:var(--acc-s)}
.slot.has{background:var(--acc);border-style:solid}
.slot:disabled{cursor:default}
.grid{display:grid;grid-template-columns:3fr 2fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.lb{display:flex;align-items:center;gap:10px;padding:9px 8px;border:0;border-top:1px solid var(--soft);width:100%;text-align:left;background:none;color:inherit;font:inherit;cursor:pointer;border-radius:0}
.lb:first-of-type{border-top:0}.lb:hover{background:var(--chip)}.lb.on{background:var(--acc-s);box-shadow:inset 4px 0 0 var(--line)}
.rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--chip);border:1.5px solid var(--line);flex:none}
.rk.g{background:var(--acc)}
.nm{flex:1;min-width:0;font-weight:700}.nm .sub{font-weight:400}.pts{font-weight:800;font-size:17px}
ul{list-style:none;margin:0;padding:0}li{padding:8px 0;border-top:1px solid var(--soft);font-size:14px}li:first-child{border-top:0}
.empty{color:var(--mute);padding:8px 0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;margin-bottom:10px}
.fld input,.fld select{width:100%;font-weight:400;font-size:15px}
.box{background:var(--acc-s);border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.box .fld{margin-bottom:0;margin-top:8px}
.opt{display:flex;align-items:center;gap:10px;font-weight:700;padding:5px 0;cursor:pointer}
.days{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.dy{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;background:#fff;cursor:pointer}
.note{background:var(--ink);color:#fff;border-radius:14px;padding:12px;font-size:13px;line-height:1.5;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:800;padding:10px;border-radius:12px;cursor:pointer}
.tab.on{background:var(--acc);box-shadow:2px 2px 0 var(--line)}
.hist .task.done .tt{text-decoration:none;color:var(--ink);font-weight:700}
.login{max-width:360px;margin:8vh auto;text-align:center}
.login img{width:96px;height:96px;border-radius:50%;border:3px solid var(--line);background:#fff;margin:0 auto 10px;display:block;object-fit:cover}
.login input{width:100%;margin-bottom:10px;text-align:left}.login .sub{margin:4px 0 14px}
.err{color:var(--red);font-size:13px;min-height:20px;font-weight:600}
.lbx{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:20px;z-index:9;cursor:pointer}
.lbx img{max-width:100%;max-height:85vh;border-radius:12px;border:3px solid var(--acc)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--acc);padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;border:2px solid var(--acc);z-index:10}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="fi" accept="image/*" hidden>
<div class="lbx" id="lbx" hidden><img id="lbi" alt="Foto bukti"></div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ========== ISI DUA BARIS INI (Supabase > Project Settings > API) ========== */
const SUPABASE_URL="https://siakzuowzhjxvefjwvig.supabase.co";
const SUPABASE_KEY="sb_publishable_brOfPR3TwnZfah0tWL8yKQ_qP8fz25p";
const POIN={selesai:10,bonus:5}; // samakan dengan angka di supabase-setup.sql
/* ========================================================================== */
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Jakarta"});
const fmt=d=>new Date(d+"T00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short"});
const dstr=()=>new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"Asia/Jakarta"});
const HARI=[["1","Sen"],["2","Sel"],["3","Rab"],["4","Kam"],["5","Jum"],["6","Sab"],["0","Min"]];
const dayText=d=>!d||d.length>=7?"Setiap hari":HARI.filter(h=>d.includes(+h[0])).map(h=>h[1]).join(", ");
const labsOf=t=>t.photo_labels&&t.photo_labels.length>1?t.photo_labels:null;
const parseLabs=s=>String(s||"").split(",").map(x=>x.trim()).filter(Boolean);
let me,sel=null,pend=null,PEOPLE=[],hdate=null;
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const nav=v=>`<div class="tabs"><button class="tab ${v==="home"?"on":""}" data-view="home">Beranda</button><button class="tab ${v==="history"?"on":""}" data-view="history">Riwayat</button></div>`;
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("on"),2200)}
const head=()=>`<header><div class="hd"><img src="icon-round.png" alt=""><div><h1>Laporan Kerja Harian</h1><div class="sub">Halo, ${esc(me.name)} · ${me.role==="leader"?"Leader":"Vaporista"}</div><div class="sub">${dstr()}</div></div></div><button class="btn" data-out>Keluar</button></header>`;
const pt=t=>t.status==="done"?POIN.selesai+(t.on_time?POIN.bonus:0):0;
const tag=t=>t.status==="done"?`<span class="tag ok">Terverifikasi</span>`:`<span class="tag ${t.due<today()?"late":""}">${t.due<today()?"Terlambat · ":""}${fmt(t.due)}</span>`;

async function boot(){
  const{data:{session}}=await db.auth.getSession();if(!session)return login();
  const{data,error}=await db.from("profiles").select("*").eq("id",session.user.id).single();
  if(error||!data)return login("Profil tidak ditemukan. Hubungi leader.");
  me=data;await db.rpc("generate_daily_tasks");me.role==="leader"?leader():employee();
}
function login(msg=""){
  app.innerHTML=`<div class="card login"><img src="icon-round.png" alt="Vapor Hitz"><h1>Masuk</h1><p class="sub">Selamat datang! Masuk dulu untuk lihat tugasmu hari ini.</p><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Kata sandi" autocomplete="current-password"><div class="err" id="er">${esc(msg)}</div><button class="btn" data-in style="width:100%">Masuk</button></div>`;
}

function empTask(t){
  const labs=labsOf(t),pa=t.proof_paths||[],isDone=t.status==="done";
  const n=labs?labs.length:1,have=isDone?n:(labs?labs.filter((_,i)=>pa[i]).length:0);
  const lead=labs?`<span class="cnt">${have}/${n}</span>`:`<button class="chk" ${isDone?"disabled":`data-up="${t.id}" data-slot="1" aria-label="Kirim foto bukti"`}>${isDone?"✓":"+"}</button>`;
  const slots=labs?`<div class="slots">${labs.map((l,i)=>{const h=isDone||pa[i];return `<button class="slot ${h?"has":""}" ${isDone?"disabled":`data-up="${t.id}" data-slot="${i+1}"`} aria-label="Foto ${esc(l)}"><b>${h?"✓":"+"}</b><span>${esc(l)}</span></button>`}).join("")}</div>`:"";
  const info=labs?`${n} foto: ${labs.map(x=>esc(x)).join(", ")}`:"1 foto bukti";
  return `<div class="task ${t.status}">${lead}<span class="tt">${esc(t.title)}<div class="sub">${info}</div></span>${tag(t)}${slots}</div>`;
}

async function employee(){
  const[a,b]=await Promise.all([db.from("tasks").select("*").eq("assignee",me.id).order("status",{ascending:false}).order("due").order("id"),db.rpc("leaderboard")]);
  if(a.error||b.error)return toast("Gagal memuat data");
  const T=a.data,L=b.data,rank=L.findIndex(x=>x.id===me.id)+1;
  const V=T.filter(t=>t.status==="todo"||t.due>=today());
  const done=V.filter(t=>t.status==="done").length,pct=V.length?Math.round(done/V.length*100):0;
  app.innerHTML=head()+`<div class="card"><div class="split"><b class="big">${done}/${V.length} tugas selesai</b><b>${T.reduce((s,t)=>s+pt(t),0)} poin · peringkat ${rank?"#"+rank:"-"}</b></div><div class="bar"><i style="width:${pct}%"></i></div><div class="sub">Daftar tetap muncul otomatis setiap hari. Ketuk kotak untuk mengirim foto bukti.</div></div>
  <div class="grid"><div class="card"><h2>Tugas hari ini</h2>${V.length?V.map(empTask).join(""):'<div class="empty">Belum ada tugas.</div>'}</div>
  <div class="card"><h2>Leaderboard</h2>${L.map((p,i)=>`<div class="lb" style="cursor:default"><span class="rk ${i<3?"g":""}">${i+1}</span><span class="nm">${esc(p.name)}${p.id===me.id?" (saya)":""}<div class="sub">${p.done}/${p.total} tugas</div></span><span class="pts">${p.points}</span></div>`).join("")}</div></div>
  <div class="note">Tugas dihitung selesai hanya kalau semua fotonya sudah terkirim.</div>`;
}

async function leader(){
  const[l,p,t,f,tp]=await Promise.all([db.rpc("leaderboard"),db.from("profiles").select("id,name").eq("role","employee").order("name"),db.from("tasks").select("*").order("due").order("id"),db.from("tasks").select("title,done_at,on_time,profiles(name)").eq("status","done").order("done_at",{ascending:false}).limit(10),db.from("task_templates").select("*").order("id")]);
  if(l.error||p.error||t.error)return toast("Gagal memuat data");
  const L=l.data,P=p.data,T=t.data;PEOPLE=P;if(!sel||!P.find(x=>x.id===sel))sel=P[0]?.id;
  const done=T.filter(x=>x.status==="done").length,late=T.filter(x=>x.status==="todo"&&x.due<today()).length,mine=T.filter(x=>x.assignee===sel);
  const nm=id=>P.find(x=>x.id===id)?.name||"";const TP=tp.data||[];
  const taskRow=x=>{
    const labs=labsOf(x),list=(x.proof_paths||[]).map((pp,i)=>[pp,i]).filter(z=>z[0]);
    const shown=list.length?list:(x.proof_path?[[x.proof_path,0]]:[]);
    const proofs=x.status==="done"?shown.map(z=>`<button class="ed" data-v="${esc(z[0])}">Bukti${shown.length>1?" "+(labs&&labs[z[1]]?esc(labs[z[1]]):z[1]+1):""}</button>`).join("")+`<button class="ed red" data-r="${x.id}">Tolak</button>`:"";
    const part=x.status==="todo"&&list.length?`<span class="tag">${list.length}/${labs?labs.length:1} foto</span>`:"";
    return `<div class="task ${x.status}"><span class="tt">${esc(x.title)}${labs?`<div class="sub">${labs.length} foto: ${labs.map(y=>esc(y)).join(", ")}</div>`:""}</span>${tag(x)}${part}<button class="ed" data-e="${x.id}">Ubah</button><button class="ed" data-d="${x.id}">Hapus</button>${proofs}</div>`;
  };
  const tplRow=x=>{
    const labs=labsOf(x);
    return `<div class="task"><span class="tt">${esc(x.title)}<div class="sub">${x.assignee?esc(nm(x.assignee)||"Vaporista"):"Semua Vaporista"} · ${dayText(x.days)} · ${labs?labs.length+" foto: "+labs.map(y=>esc(y)).join(", "):"1 foto"}</div></span><button class="ed" data-te="${x.id}">Ubah</button><button class="ed red" data-td="${x.id}">Hapus</button></div>`;
  };
  app.innerHTML=head()+nav("home")+`<div class="stats"><div class="stat"><b>${done}/${T.length}</b><span>Tugas tim selesai</span></div><div class="stat"><b>${T.length?Math.round(done/T.length*100):0}%</b><span>Progres tim</span></div><div class="stat"><b style="color:var(--red)">${late}</b><span>Terlambat</span></div></div>
  <div class="grid"><div><div class="card"><h2>Leaderboard</h2>${L.length?L.map((x,i)=>`<button class="lb ${x.id===sel?"on":""}" data-p="${x.id}"><span class="rk ${i<3?"g":""}">${i+1}</span><span class="nm">${esc(x.name)}<div class="sub">${x.done}/${x.total} tugas</div></span><span class="pts">${x.points}</span></button>`).join(""):'<div class="empty">Belum ada karyawan.</div>'}</div>
  <div class="card"><h2>Tugas ${esc(nm(sel))}</h2>${mine.length?mine.map(taskRow).join(""):'<div class="empty">Belum ada tugas.</div>'}</div></div>
  <div><div class="card" id="fm"><h2>Tambah tugas</h2>
    <label class="fld">Untuk siapa<select id="na"><option value="all">Semua Vaporista</option>${P.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></label>
    <label class="fld">Judul tugas<input id="nt" placeholder="Contoh: Bersih-bersih teras"></label>
    <div class="box"><label class="opt"><input type="checkbox" id="nm" data-sync> Butuh lebih dari 1 foto</label>
      <div id="nlw" hidden><label class="fld">Nama tiap foto, pisahkan dengan koma<input id="nl" placeholder="Instagram, WhatsApp, Channel"></label><div class="sub">Tugas selesai kalau semua foto sudah terkirim.</div></div></div>
    <div class="box"><b>Berlaku</b>
      <label class="opt"><input type="radio" name="mode" value="daily" checked data-sync> Setiap hari</label>
      <label class="opt"><input type="radio" name="mode" value="days" data-sync> Hari tertentu saja</label>
      <div class="days" id="dw" hidden>${HARI.map(h=>`<label class="dy"><input type="checkbox" class="dayc" value="${h[0]}" checked>${h[1]}</label>`).join("")}</div>
      <label class="opt"><input type="radio" name="mode" value="once" data-sync> Satu tanggal saja</label>
      <div id="dd" hidden><label class="fld">Tanggal<input id="nd" type="date" value="${today()}"></label></div></div>
    <button class="btn" data-add style="width:100%">Tambah</button></div>
  <div class="card"><h2>Daftar tugas tetap</h2><p class="sub">Muncul otomatis setiap hari untuk Vaporista yang dipilih. Vaporista baru langsung ikut menerima tugas "Semua Vaporista".</p>${TP.length?TP.map(tplRow).join(""):'<div class="empty">Belum ada tugas tetap.</div>'}</div>
  <div class="card"><h2>Aktivitas terbaru</h2><ul>${(f.data||[]).map(x=>`<li><b>${esc(x.profiles?.name)}</b> menyelesaikan “${esc(x.title)}” ${x.on_time?"":'<span class="tag late">terlambat</span>'}<div class="sub">${new Date(x.done_at).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div></li>`).join("")||'<div class="empty">Belum ada aktivitas.</div>'}</ul></div></div></div>`;
}

async function history(){
  if(!hdate)hdate=addDays(today(),-1);
  const{data,error}=await db.from("tasks").select("*,profiles(name)").eq("due",hdate).order("id");
  if(error)return toast("Gagal memuat riwayat");
  const by={};data.forEach(x=>{(by[x.assignee]=by[x.assignee]||{name:x.profiles?.name||"Vaporista",list:[]}).list.push(x)});
  const groups=Object.values(by).sort((a,b)=>a.name.localeCompare(b.name));
  const total=data.length,doneT=data.filter(x=>x.status==="done").length,onT=data.filter(x=>x.status==="done"&&x.on_time).length;
  const label=new Date(hdate+"T00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const row=x=>{
    const labs=labsOf(x),list=(x.proof_paths||[]).map((pp,i)=>[pp,i]).filter(z=>z[0]);
    const shown=list.length?list:(x.proof_path?[[x.proof_path,0]]:[]);
    const time=x.done_at?new Date(x.done_at).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Jakarta"}):"";
    const st=x.status==="done"?`<span class="tag ok">Selesai · ${time}</span><span class="tag ${x.on_time?"":"late"}">${x.on_time?"Tepat waktu":"Terlambat"}</span>`:`<span class="tag late">Belum selesai</span>`+(list.length?`<span class="tag">${list.length}/${labs?labs.length:1} foto</span>`:"");
    const proofs=shown.map(z=>`<button class="ed" data-v="${esc(z[0])}">Bukti${shown.length>1?" "+(labs&&labs[z[1]]?esc(labs[z[1]]):z[1]+1):""}</button>`).join("");
    return `<div class="task ${x.status}"><span class="tt">${esc(x.title)}${labs?`<div class="sub">${labs.length} foto: ${labs.map(y=>esc(y)).join(", ")}</div>`:""}</span>${st}${proofs}</div>`;
  };
  app.innerHTML=head()+nav("history")+`<div class="card"><h2>Pilih tanggal</h2><div class="row"><button class="ed" data-hdn="-1">‹ Sebelumnya</button><input id="hd" type="date" value="${hdate}"><button class="ed" data-hdn="1">Berikutnya ›</button></div><div class="row" style="margin-top:8px"><button class="ed" data-hdt="-1">Kemarin</button><button class="ed" data-hdt="0">Hari ini</button></div></div>
  <h2 style="margin-bottom:12px">${label}</h2>
  ${total?`<div class="stats"><div class="stat"><b>${doneT}/${total}</b><span>Tugas selesai</span></div><div class="stat"><b>${onT}</b><span>Tepat waktu</span></div><div class="stat"><b style="color:var(--red)">${total-doneT}</b><span>Belum selesai</span></div></div>
  <div class="hist">${groups.map(g=>{const d=g.list.filter(x=>x.status==="done").length;return `<div class="card"><h2>${esc(g.name)}</h2><div class="sub" style="margin-bottom:6px">${d}/${g.list.length} tugas selesai</div>${g.list.map(row).join("")}</div>`}).join("")}</div>`:`<div class="card"><div class="empty">Belum ada laporan di tanggal ini. Laporan mulai tersimpan sejak tugas pertama dibuat.</div></div>`}`;
}

function syncForm(){
  const m=document.querySelector("input[name=mode]:checked").value;
  $("#dw").hidden=m!=="days";$("#dd").hidden=m!=="once";$("#nlw").hidden=!$("#nm").checked;
}
function shrink(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(Error("Gambar gagal diproses")),"image/jpeg",.75)};im.onerror=()=>no(Error("File bukan gambar"));im.src=URL.createObjectURL(f)})}
async function upload(id,slot,file){
  try{const blob=await shrink(file),path=`${me.id}/${id}-${slot}-${Date.now()}.jpg`;
    let r=await db.storage.from("proofs").upload(path,blob,{contentType:"image/jpeg"});if(r.error)throw r.error;
    r=await db.rpc("submit_proof",{p_task:id,p_slot:slot,p_path:path});if(r.error)throw r.error;
    toast("Foto terkirim");employee();
  }catch(e){toast("Gagal: "+e.message)}
}
$("#fi").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f&&pend)upload(pend.id,pend.slot,f)};
$("#lbx").onclick=e=>e.currentTarget.hidden=true;

app.onclick=async e=>{
  const g=k=>e.target.closest(`[data-${k}]`);
  if(g("sync"))return syncForm();
  if(g("view"))return g("view").dataset.view==="history"?history():leader();
  if(g("hdn")){hdate=addDays(hdate||today(),+g("hdn").dataset.hdn);return history()}
  if(g("hdt")){hdate=addDays(today(),+g("hdt").dataset.hdt);return history()}
  if(g("in")){const{error}=await db.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});return error?$("#er").textContent="Email atau kata sandi salah":boot()}
  if(g("out")){await db.auth.signOut();return login()}
  if(g("up")){const b=g("up");pend={id:+b.dataset.up,slot:+b.dataset.slot||1};return $("#fi").click()}
  if(g("p")){sel=g("p").dataset.p;return leader()}
  if(g("add")){
    const title=$("#nt").value.trim();if(!title)return toast("Isi judul tugas");
    let labels=null;
    if($("#nm").checked){labels=parseLabs($("#nl").value);if(labels.length<2)return toast("Isi minimal 2 nama foto, pisahkan dengan koma")}
    const who=$("#na").value,mode=document.querySelector("input[name=mode]:checked").value;
    if(mode==="once"){
      const due=$("#nd").value;if(!due)return toast("Pilih tanggal");
      const ids=who==="all"?PEOPLE.map(x=>x.id):[who];if(!ids.length)return toast("Belum ada Vaporista");
      const{error}=await db.from("tasks").insert(ids.map(a=>({assignee:a,title,due,photo_labels:labels})));
      if(who!=="all")sel=who;toast(error?"Gagal: "+error.message:(who==="all"?"Tugas dikirim ke semua Vaporista":"Tugas ditambahkan"));return leader();
    }
    let days=null;
    if(mode==="days"){days=[...document.querySelectorAll(".dayc:checked")].map(x=>+x.value);if(!days.length)return toast("Pilih minimal satu hari");if(days.length===7)days=null}
    const{error}=await db.from("task_templates").insert({assignee:who==="all"?null:who,title,photo_labels:labels,days});
    if(who!=="all")sel=who;
    if(!error)await db.rpc("generate_daily_tasks");
    toast(error?"Gagal: "+error.message:"Tugas tetap ditambahkan");return leader();
  }
  if(g("te")){const id=+g("te").dataset.te,t=(await db.from("task_templates").select("title,photo_labels").eq("id",id).single()).data;
    const title=prompt("Judul tugas tetap:",t.title);if(!title||!title.trim())return;
    const lt=prompt("Nama tiap foto, pisahkan dengan koma. Kosongkan kalau cukup 1 foto:",(t.photo_labels||[]).join(", "));if(lt===null)return;
    const pl=parseLabs(lt),labels=pl.length>1?pl:null;
    const{error}=await db.from("task_templates").update({title:title.trim(),photo_labels:labels}).eq("id",id);
    if(!error){
      await db.from("tasks").update({title:title.trim()}).eq("template_id",id).eq("status","todo").gte("due",today());
      await db.from("tasks").update({photo_labels:labels}).eq("template_id",id).eq("status","todo").gte("due",today()).eq("proof_paths","{}");
    }
    toast(error?"Gagal: "+error.message:"Tugas tetap diperbarui");return leader()}
  if(g("td")){if(!confirm("Hapus tugas tetap ini? Tugas hari ini yang belum selesai ikut dihapus."))return;const id=+g("td").dataset.td;
    await db.from("tasks").delete().eq("template_id",id).eq("status","todo").gte("due",today());
    const{error}=await db.from("task_templates").delete().eq("id",id);toast(error?"Gagal: "+error.message:"Tugas tetap dihapus");return leader()}
  if(g("e")){const id=+g("e").dataset.e,t=(await db.from("tasks").select("title,due").eq("id",id).single()).data;
    const title=prompt("Judul tugas:",t.title);if(title===null)return;const due=prompt("Tenggat (YYYY-MM-DD):",t.due);if(due===null)return;
    const upd={};if(title.trim())upd.title=title.trim();if(/^\d{4}-\d{2}-\d{2}$/.test(due.trim()))upd.due=due.trim();
    const{error}=await db.from("tasks").update(upd).eq("id",id);toast(error?"Gagal: "+error.message:"Tugas diperbarui");return leader()}
  if(g("d")){if(!confirm("Hapus tugas ini?"))return;const{error}=await db.from("tasks").delete().eq("id",+g("d").dataset.d);toast(error?"Gagal: "+error.message:"Tugas dihapus");return leader()}
  if(g("v")){const{data,error}=await db.storage.from("proofs").createSignedUrl(g("v").dataset.v,300);if(error)return toast("Foto tidak bisa dibuka");$("#lbi").src=data.signedUrl;return $("#lbx").hidden=false}
  if(g("r")){const id=+g("r").dataset.r;if(!confirm("Tolak bukti dan kembalikan tugas? Semua foto tugas ini dihapus."))return;
    const row=(await db.from("tasks").select("proof_path,proof_paths").eq("id",id).single()).data||{};
    const files=[...new Set([...(row.proof_paths||[]),row.proof_path].filter(Boolean))];
    const{error}=await db.from("tasks").update({status:"todo",proof_path:null,proof_paths:[],done_at:null,on_time:null}).eq("id",id);
    if(!error&&files.length)await db.storage.from("proofs").remove(files);
    toast(error?"Gagal: "+error.message:"Bukti ditolak");return leader()}
};
app.onchange=e=>{if(e.target.id==="hd"&&e.target.value){hdate=e.target.value;history()}};
boot();
</script>
</body>
</html>
